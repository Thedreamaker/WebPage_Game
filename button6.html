<!DOCTYPE html>
<html>
<head>
    <title>How Do You Do?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
            transition: background-color 0.5s ease, color 0.5s ease;
            margin: 0;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            margin: 5px 10px;
            color: white;
            font-weight: bold;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-good { background-color: #28a745; }
        .btn-good:hover { background-color: #218838; }
        .btn-bad { background-color: #dc3545; }
        .btn-bad:hover { background-color: #c82333; }
        
        .input-section {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 55%;
            border: 2px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        input[type="color"] {
            width: 45px;
            height: 42px;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        .btn-submit {
            background-color: #007bff;
            padding: 10px 15px;
            font-size: 16px;
            margin: 0;
        }
        .btn-submit:hover { background-color: #0056b3; }

        #output {
            margin-top: 30px;
            font-size: 32px;
            font-weight: bold;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #output.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Action Controls Layout */
        .controls-section {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn-control {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #6c757d;
        }
        .btn-control:hover { background-color: #5a6268; }
        .btn-clear {
            background-color: #f8f9fa;
            color: #dc3545;
            border: 1px solid #dc3545;
        }
        .btn-clear:hover {
            background-color: #dc3545;
            color: white;
        }

        /* History Log Container hidden by default */
        .history-section {
            margin-top: 25px;
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
            display: none; 
        }
        .history-section h3 {
            margin-bottom: 10px;
            color: #444;
            text-align: center;
            font-size: 18px;
        }
        #history-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>How do you do?</h1>

        <!-- Quick Choice Buttons -->
        <button class="btn btn-good" onclick="handleMood('Good', '#d4edda', '#155724')">Good</button>
        <button class="btn btn-bad" onclick="handleMood('Bad', '#f8d7da', '#721c24')">Bad</button>

        <!-- Custom Section -->
        <div class="input-section">
            <div class="input-group">
                <input type="text" id="custom-mood" placeholder="Type a mood or keyword...">
                <input type="color" id="custom-color" value="#e2e3e5" title="Choose a background color" oninput="updateLiveBg(this.value)">
            </div>
            <button class="btn btn-submit" onclick="submitCustomMood()">Submit Mood</button>
        </div>

        <!-- The animated result display -->
        <div id="output"></div>

        <!-- Action Controls -->
        <div class="controls-section">
            <button class="btn btn-control" onclick="toggleHistory()">Lets Track</button>
            <button class="btn btn-control btn-clear" onclick="clearHistory()">Clear History</button>
        </div>

        <!-- History Log Container -->
        <div class="history-section" id="history-panel">
            <h3>Recent Moods</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        let chosenColor = "#e2e3e5";

        function updateLiveBg(colorValue) {
            chosenColor = colorValue;
            document.body.style.backgroundColor = colorValue;
        }

        function toggleHistory() {
            const panel = document.getElementById("history-panel");
            if (panel.style.display === "block") {
                panel.style.display = "none";
            } else {
                panel.style.display = "block";
            }
        }

        function clearHistory() {
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = ""; // Removes all structural text inside history panel
        }

        function addHistoryItem(text, bgColor, textColor) {
            const historyList = document.getElementById("history-list");
            const item = document.createElement("div");
            
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            item.className = "history-item";
            item.style.backgroundColor = bgColor;
            item.style.color = textColor;
            item.innerHTML = `<span>${text}</span> <span style="font-size:11px; opacity:0.8;">${timeString}</span>`;
            
            historyList.prepend(item);
        }

        function handleMood(statusText, bgColor, textColor) {
            const outputDiv = document.getElementById("output");
            outputDiv.classList.remove("show");
            
            setTimeout(() => {
                outputDiv.textContent = statusText;
                outputDiv.style.color = textColor;
                document.body.style.backgroundColor = bgColor;
                outputDiv.classList.add("show");
                
                addHistoryItem(statusText, bgColor, textColor);
            }, 200);
        }

        function submitCustomMood() {
            const inputField = document.getElementById("custom-mood");
            const colorPicker = document.getElementById("custom-color");
            
            let mood = inputField.value.trim();
            if (mood === "") return;

            let lowerMood = mood.toLowerCase();
            let finalBgColor;
            let finalTextColor;

            if (chosenColor !== "#e2e3e5") {
                finalBgColor = chosenColor;
                finalTextColor = "#111111";
            } else if (lowerMood === "tired") {
                finalBgColor = "#e2d4f0";  
                finalTextColor = "#4a154b"; 
            } else if (lowerMood === "happy") {
                finalBgColor = "#fff3cd";  
                finalTextColor = "#856404"; 
            } else if (lowerMood === "sad") {
                finalBgColor = "#d1ecf1";  
                finalTextColor = "#0c5460";
            } else {
                finalBgColor = "#e2e3e5";
                finalTextColor = "#333333"; 
            }
            
            handleMood(mood, finalBgColor, finalTextColor);
            
            inputField.value = "";
            chosenColor = "#e2e3e5";
            colorPicker.value = "#e2e3e5";
        }
    </script>

</body>
</html>
